baseURL = "/"
relativeURLs = true
languageCode = "en-us"
title = "Py AI Symposium 2025"

# theme
theme = "devfest-theme-hugo"

# params
[params]
    title = "Py AI Symposium 2025"
    date = "2025-11-30"  # update date 
    description = ""
    images = ["/images/"]
    email = "pyconkr@pycon.kr"
    keywords = "event, python, ai"
    appleTouchIcon = "apple-touch-icon.png"
    cfpUrl = "https://apidays.typeform.com/to/ILJeAaV8?typeform-source=www.apidays.global#event_name=xxxxx"
    favicon32 = "/favicon.ico"
    favicon16 = "/favicon.ico"
    safariPinnedTab = "/safari-pinned-tab.svg"
    themeColor = "#00040f"
    
[params.logos]
    jumbo = "images/logos/json-schema-logo-white.svg"
    header = "images/logos/json-schema-logo-white.svg"
    footer = "images/logos/json-schema-logo-white.svg"

[Data]
  schedule = "2025-11-30"  # update date 

[menu]
[[menu.main]]
    identifier = "apply-to-speak"
    name = "CFP"
    url = "https://forms.gle/zaVhgqdPvja38rVw6"
    weight = 200
    external = false

[languages]
[languages.en]
    weight = 1
    languageName = "gb"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[taxonomies]
  tag = "tags"

[privacy]
  [privacy.disqus]
    disable = true
  [privacy.googleAnalytics]
    anonymizeIP = false
    disable = true
    respectDoNotTrack = false
    useSessionStorage = false
  [privacy.instagram]
    disable = true
    simple = false
  [privacy.twitter]
    disable = false
    enableDNT = false
    simple = false
  [privacy.vimeo]
    disable = true
    simple = false
  [privacy.youtube]
    disable = false
    privacyEnhanced = false
